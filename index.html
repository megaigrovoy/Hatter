<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hatter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/hat-icon.svg" />
    <link rel="icon" href="/hat-icon.svg" type="image/svg+xml" />
    <title>Hatter · Лови шляпу головой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <link rel="preload" href="/mediapipe-wasm/vision_wasm_internal.js" as="script" />
    <link rel="preload" href="/mediapipe-wasm/vision_wasm_internal.wasm" as="fetch" type="application/wasm" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="game-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer">
        <div id="hud-game" class="hud-game is-hidden">
          <div id="game-over-overlay" class="game-over-overlay is-hidden" aria-live="assertive">
            <span data-i18n="gameOver">ИГРА ОКОНЧЕНА</span>
          </div>
          <div id="victory-overlay" class="victory-overlay is-hidden" aria-live="polite">
            <span data-i18n="victory">Уровень пройден!</span>
          </div>
          <div id="catch-tutorial-overlay" class="catch-tutorial-overlay is-hidden" aria-live="polite">
            <div class="catch-tutorial-wrap">
              <div class="catch-tutorial-figure">
                <svg viewBox="0 0 640 300" class="catch-tutorial-svg" aria-hidden="true">
                  <defs>
                    <linearGradient id="tutHatG" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#c9a6ff" />
                      <stop offset="1" stop-color="#7b4dff" />
                    </linearGradient>
                  </defs>
                  <g opacity="0.32">
                    <path d="M160 40 L160 200" stroke="#8fd6ff" stroke-width="3" stroke-dasharray="9 11" />
                    <path d="M480 40 L480 140" stroke="#8fd6ff" stroke-width="3" stroke-dasharray="9 11" />
                  </g>
                  <g transform="translate(160 46)">
                    <ellipse cx="0" cy="20" rx="62" ry="13" fill="url(#tutHatG)" />
                    <path d="M-34 20 L-28 -30 Q0 -42 28 -30 L34 20 Z" fill="url(#tutHatG)" />
                    <rect x="-30" y="2" width="60" height="12" rx="5" fill="#ffcf4d" />
                  </g>
                  <g transform="translate(160 236)">
                    <circle cx="0" cy="-38" r="30" fill="none" stroke="#4fe3a1" stroke-width="5" />
                    <path d="M-40 22 Q0 -6 40 22" fill="none" stroke="#4fe3a1" stroke-width="5" stroke-linecap="round" />
                  </g>
                  <g transform="translate(480 236)" opacity="0.85">
                    <circle cx="0" cy="-38" r="30" fill="none" stroke="#ff6b6b" stroke-width="5" />
                    <path d="M-40 22 Q0 -6 40 22" fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round" />
                    <g transform="translate(0 -112)">
                      <ellipse cx="0" cy="20" rx="52" ry="11" fill="#ff6b6b" opacity="0.45" />
                      <path d="M-28 20 L-23 -22 Q0 -32 23 -22 L28 20 Z" fill="#ff6b6b" opacity="0.45" />
                    </g>
                    <path d="M-56 -96 L56 4 M56 -96 L-56 4" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" opacity="0.9" />
                  </g>
                </svg>
                <div class="catch-tutorial-labels">
                  <div class="catch-tutorial-half">
                    <span class="catch-tutorial-label" data-i18n="tutCatch">Подставь голову — шляпа наденется</span>
                  </div>
                  <div class="catch-tutorial-half">
                    <span class="catch-tutorial-label" data-i18n="tutMiss">Упавшая шляпа — минус жизнь</span>
                  </div>
                </div>
              </div>
              <div id="catch-tutorial-countdown" class="catch-tutorial-countdown">5</div>
            </div>
          </div>
          <div id="campaign-complete-overlay" class="campaign-complete-overlay is-hidden" aria-live="polite">
            <div class="campaign-complete-panel">
              <h2 class="campaign-complete-title" data-i18n="youWon">Ты победил!</h2>
              <p id="campaign-score-line" class="campaign-score-line"></p>
              <p id="campaign-rank-line" class="campaign-rank-line"></p>
              <div class="leaderboard-block">
                <div class="leaderboard-title" data-i18n="leaderboardTitle">Топ-10 на этом устройстве</div>
                <ol id="leaderboard-list" class="leaderboard-list"></ol>
              </div>
              <button type="button" id="btn-campaign-menu" class="btn-start btn-campaign-menu" data-i18n="btnBackMenu">Меню</button>
            </div>
          </div>
          <h1 id="score-display">Счёт: 0</h1>
          <div class="hud-row">
            <span id="level-display">Уровень: 1</span>
            <span id="lives-display" class="lives-display"></span>
            <span id="players-display"></span>
          </div>
          <div id="quota-display" class="quota-display"></div>
          <button type="button" id="btn-back-menu" class="btn-menu btn-back-menu" data-i18n="btnBackMenu">Меню</button>
        </div>
        <div id="main-menu" class="menu-overlay is-hidden">
          <div class="menu-panel">
            <div class="menu-poster-wrap">
              <div class="menu-poster" role="img" aria-label="Hatter">
                <svg viewBox="0 0 640 360" class="menu-poster-svg" aria-hidden="true">
                  <defs>
                    <linearGradient id="posterBg" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#1b1233" />
                      <stop offset="1" stop-color="#0d0a18" />
                    </linearGradient>
                    <linearGradient id="posterHat" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#d6bcff" />
                      <stop offset="1" stop-color="#7b4dff" />
                    </linearGradient>
                  </defs>
                  <rect width="640" height="360" fill="url(#posterBg)" />
                  <g opacity="0.5">
                    <circle cx="90" cy="86" r="2.5" fill="#8fd6ff" />
                    <circle cx="520" cy="52" r="2" fill="#ffcf4d" />
                    <circle cx="586" cy="150" r="2.5" fill="#ff9de2" />
                    <circle cx="58" cy="230" r="2" fill="#8fd6ff" />
                  </g>
                  <g transform="translate(150 116) rotate(-13)">
                    <ellipse cx="0" cy="26" rx="66" ry="14" fill="url(#posterHat)" opacity="0.9" />
                    <path d="M-36 26 L-30 -30 Q0 -44 30 -30 L36 26 Z" fill="url(#posterHat)" />
                    <rect x="-32" y="6" width="64" height="13" rx="5" fill="#ffcf4d" />
                  </g>
                  <g transform="translate(474 132) rotate(15)">
                    <ellipse cx="0" cy="22" rx="52" ry="11" fill="#4fe3a1" opacity="0.85" />
                    <path d="M-28 22 L-23 -22 Q0 -33 23 -22 L28 22 Z" fill="#4fe3a1" />
                    <rect x="-25" y="4" width="50" height="11" rx="4" fill="#0d0a18" opacity="0.55" />
                  </g>
                  <g transform="translate(320 300)">
                    <circle cx="0" cy="-44" r="36" fill="none" stroke="#8fd6ff" stroke-width="6" />
                    <path d="M-52 30 Q0 -8 52 30" fill="none" stroke="#8fd6ff" stroke-width="6" stroke-linecap="round" />
                  </g>
                  <text x="320" y="62" text-anchor="middle" font-family="Outfit, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="6">HATTER</text>
                </svg>
              </div>
            </div>
            <div class="menu-action-row">
              <button type="button" id="btn-start" class="btn-start menu-action-play" data-i18n="btnStart">Играть</button>
              <button type="button" id="btn-fullscreen" class="btn-menu-action btn-fullscreen" hidden>
                <span class="btn-fullscreen-on" aria-hidden="true">⛶</span>
                <span class="btn-fullscreen-off" aria-hidden="true">⛶</span>
                <span class="btn-fullscreen-label" data-i18n="fullscreen">На весь экран</span>
              </button>
              <a href="https://blagogames.com/games" class="btn-menu-action btn-gallery" id="btn-gallery">
                <span class="btn-gallery-icon" aria-hidden="true">🎮</span>
                <span class="btn-gallery-label" data-i18n="galleryLink">Все игры</span>
              </a>
            </div>
            <div class="menu-settings-grid">
              <div class="menu-options" role="group">
                <div class="menu-options-title" data-i18n="optionsTitle">Звук и музыка</div>
                <div class="menu-volume-row">
                  <div class="menu-volume-head">
                    <span data-i18n="volSfx">Громкость эффектов</span>
                    <span class="menu-volume-value" id="vol-sfx-val">100%</span>
                  </div>
                  <input type="range" id="vol-sfx" min="0" max="100" value="100" step="1" class="menu-volume-slider" aria-label="SFX volume" />
                </div>
                <div class="menu-volume-row">
                  <div class="menu-volume-head">
                    <span data-i18n="volMusic">Громкость музыки</span>
                    <span class="menu-volume-value" id="vol-music-val">100%</span>
                  </div>
                  <input type="range" id="vol-music" min="0" max="100" value="100" step="1" class="menu-volume-slider" aria-label="Music volume" />
                </div>
              </div>
              <div class="menu-settings-right">
                <div class="menu-inline-panel">
                  <div class="menu-inline-panel-title" data-i18n="cornerLangTitle">ЯЗЫК</div>
                  <div class="menu-lang" role="radiogroup" aria-label="Language">
                    <label class="menu-lang-pill">
                      <input type="radio" name="hatter-lang" id="opt-lang-ru" value="ru" checked />
                      <span>RU</span>
                    </label>
                    <label class="menu-lang-pill">
                      <input type="radio" name="hatter-lang" id="opt-lang-en" value="en" />
                      <span>EN</span>
                    </label>
                  </div>
                </div>
                <div class="menu-inline-panel">
                  <div class="menu-inline-panel-title" data-i18n="cornerPlayersTitle">ИГРОКИ</div>
                  <div class="menu-player-quick" role="group" id="players-count-group" aria-label="Игроков на камере">
                    <button type="button" id="btn-players-1" class="btn-player-count" aria-pressed="true">1</button>
                    <button type="button" id="btn-players-2" class="btn-player-count" aria-pressed="false">2</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="loading" class="visible">
          <div id="loading-logo" aria-hidden="true">🎩</div>
          <div id="loading-text">Загрузка моделей…</div>
          <div id="progress-container">
            <div id="progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
